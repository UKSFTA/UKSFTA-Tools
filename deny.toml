# cargo-deny configuration. The dependency scan workflow runs
# `cargo deny check` against this file.
#
# The licence allowlist below covers the permissive licences the dependency
# tree uses. Confirm it with `cargo deny check`: add any licence the run
# reports as missing, and remove any entry the tree does not use.

[advisories]
ignore = [
  # russh 0.65.4 is the latest release and its russh-util 0.52 depends on
  # chrono, which RUSTSEC-2026-0543 marks unmaintained. No safe upgrade
  # exists. chrono is used for timestamps, not to parse network input.
  # Re-check when russh updates russh-util.
  { id = "RUSTSEC-2026-0543", reason = "no safe upgrade in the latest russh; timestamps only" },
  # console-subscriber pulls humantime, which wraps the unmaintained chrono.
  # RUSTSEC-2026-0542 has no safe upgrade. The crate runs only behind the
  # optional console feature and formats timestamps, nothing else.
  { id = "RUSTSEC-2026-0542", reason = "optional console feature; humantime wraps chrono for timestamps" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
