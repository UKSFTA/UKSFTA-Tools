[package]
name = "uksfta"
version = "0.10.1"
edition = "2021"
rust-version = "1.89"
description = "UKSFTA modpack manager"
license = "MIT"
repository = "https://github.com/UKSFTA/UKSFTA-Tools"
readme = "README.md"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
console-subscriber = { version = "0.5.0", optional = true }
dirs = "6"
html-escape = "0.3"
indicatif = "0.18"
memchr = "2"
openssh-sftp-client = "=0.15.12"
reqwest = { version = "0.13", features = ["blocking"] }
rpassword = "7.5.5"
russh = { version = "=0.65.4", default-features = false, features = ["flate2", "rsa", "ring"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-stream = "0.1"
toml = "1.1"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
sftp-live = []
console = ["dep:console-subscriber"]

[dev-dependencies]
assert_cmd = "2"
static_assertions = "1"
predicates = "3"
tempfile = "3"
divan = "0.1.21"

[[bench]]
name = "hot_paths"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
