[package]
name = "uksfta"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
html-escape = "0.2"
reqwest = { version = "0.13", features = ["blocking"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
