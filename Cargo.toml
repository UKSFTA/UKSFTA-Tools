[package]
name = "uksfta"
version = "0.4.1"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
html-escape = "0.2"
indicatif = "0.17"
reqwest = { version = "0.13", features = ["blocking"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
walkdir = "2"
