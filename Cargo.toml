[package]
name = "uksfta"
version = "0.8.0"
edition = "2021"
rust-version = "1.82"
description = "UKSFTA modpack manager"
license = "MIT"
repository = "https://github.com/UKSFTA/UKSFTA-Tools"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
html-escape = "0.2"
indicatif = "0.18"
reqwest = { version = "0.13", features = ["blocking"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
walkdir = "2"
