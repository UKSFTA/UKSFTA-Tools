services:
  sftp:
    build: .
    image: uksfta-sftp-test:latest
    network_mode: host
    command: ["/usr/sbin/sshd", "-D", "-e", "-p", "2222", "-p", "2223"]
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2222'"]
      interval: 2s
      timeout: 2s
      retries: 15
