name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: uksfta-linux
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: uksfta-linux-arm64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: uksfta-macos-arm64
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: uksfta-windows.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/uksfta${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Normalise Asset Names
        run: |
          # Each artifact keeps its own directory. Stage the binaries under
          # their asset names in a separate directory, because the arm64
          # asset name is also the name of its artifact directory.
          mkdir -p dist/assets
          cp dist/uksfta-linux/uksfta dist/assets/uksfta
          cp dist/uksfta-linux-arm64/uksfta dist/assets/uksfta-linux-arm64
          cp dist/uksfta-macos-arm64/uksfta dist/assets/uksfta-macos-arm64
          cp dist/uksfta-windows.exe/uksfta.exe dist/assets/uksfta.exe
          rm -rf dist/uksfta-linux dist/uksfta-linux-arm64 dist/uksfta-macos-arm64 dist/uksfta-windows.exe

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate Changelog
        id: changelog
        run: |
          # Release notes for this tag: the commits since the previous
          # tag. git-cliff reads conventional commits and groups them.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.1.0")
          git-cliff --config .cliff.toml "${PREV_TAG}..HEAD" > changelog.txt
          echo "BODY_PATH=changelog.txt" >> "$GITHUB_ENV"

      - name: Generate Checksums
        run: |
          cd dist/assets
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign release artifacts
        run: |
          # Keyless signing through the GitHub OIDC token. One bundle per
          # binary, named after the binary, so an installer can verify the
          # exact file it downloaded.
          for asset in dist/assets/uksfta dist/assets/uksfta-linux-arm64 dist/assets/uksfta-macos-arm64 dist/assets/uksfta.exe; do
            if [ -f "$asset" ]; then
              cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            fi
          done

      - name: Stage Installers
        run: |
          # The one-liner installers are served from the release assets, so
          # copy them into the upload directory alongside the binaries.
          cp install.ps1 install.sh dist/assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/assets/*
          body_path: ${{ env.BODY_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
