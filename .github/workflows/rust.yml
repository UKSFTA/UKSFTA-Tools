name: Rust

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Check changelog is up to date
        run: |
          # Generate from v0.1.0 (first Rust release) to HEAD so the
          # pre-Rust HEMTT history is not included.
          #
          # Squash merges append "(#NN)" to a commit subject after the
          # changelog was generated, so the committed file can hold either
          # form. Strip "(#NN)" from both sides before comparing so the
          # check is immune to the suffix either way.
          git-cliff v0.1.0..HEAD -o /tmp/CHANGELOG.new
          sed -E 's/ \(#[0-9]+\)$//' /tmp/CHANGELOG.new > /tmp/CHANGELOG.norm
          sed -E 's/ \(#[0-9]+\)$//' CHANGELOG.md > /tmp/CHANGELOG.comm
          diff /tmp/CHANGELOG.norm /tmp/CHANGELOG.comm
          echo "CHANGELOG.md is up to date."