# Auto-label new issues and PRs based on file paths
name: Auto-Label

on:
  pull_request_target:
    types: [opened, synchronize]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
