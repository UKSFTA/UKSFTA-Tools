name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .github/linters/.markdownlint.json
          # Use ROBUST recursive exclusion patterns
          globs: |
            **/*.md
            !**/node_modules/**
            !**/.hemttout/**

      - name: Lint Shell Scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: |
            target
            .hemttout

  ast-grep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan for local performance patterns
        shell: bash
        run: |
          matches=$(npx --yes -p @ast-grep/cli sg scan src \
            --config .ast-grep/sgconfig.yml \
            --min-severity warning \
            --json=stream)
          if [ -n "$matches" ] && [ "$matches" != "[]" ]; then
            npx --yes -p @ast-grep/cli sg scan src \
              --config .ast-grep/sgconfig.yml \
              --min-severity warning
            exit 1
          fi

  lint-ps1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell Scripts
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Warning,Error
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }
