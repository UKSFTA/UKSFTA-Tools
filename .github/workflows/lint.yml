name: Lint

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .github/linters/.markdownlint.json
          # Use ROBUST recursive exclusion patterns
          globs: |
            **/*.md
            !**/node_modules/**
            !**/.hemttout/**
