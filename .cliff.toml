# Configuration for git-cliff, the changelog generator.
# It reads conventional commits and produces CHANGELOG.md.
# See https://git-cliff.org for the full reference.

[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
This project uses [Semantic Versioning](https://semver.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs", group = "Documentation" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^refactor", group = "Miscellaneous" },
  { message = "^test", group = "Miscellaneous" },
  { message = "^style", group = "Miscellaneous" },
  { message = "^perf", group = "Miscellaneous" },
]
filter_commits = false
# Topological order so dependencies (e.g. chore(deps)) read naturally.
topo_order = true
sort_commits = "newest"
