"eVisibility\":0,\"bIsValidAppHub\":true,\"bAllowWebUploads\":true,\"rgHiddenTabs\":[],\"rgContentDescriptorIDs\":[2,5],\"rgUserPreferencesOverlappingContentDescriptorIDs\":[],\"bShowAdminTab\":false,\"bStoreVisible\":true,\"strHeaderImageURL\":\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/107410/header.jpg?t=1786458620\",\"strIntegratedGuideURL\":\"\",\"strRedirectURL\":\"\",\"bHideDefaultGuideCategories\":false},\"strDescription\":\"Arma 3 - Authentic, diverse, open: Arma 3 sends you to war. The third installment in the legendary Arma franchise is the gold standard military sandbox on PC, featuring combined arms warfare, authentic weapons and assets, and a wide variety of single- and multiplayer content. Arma 3 now includes the Apex and Contact expansions, offering hundreds of hours of additional gameplay right out of the box. And for those who want all available official content from the get-go, Arma 3 Platinum includes the base game and every official expansion and DLC. Deploy into massive open worlds where ballistics are realistic, maneuvering keeps you alive, and teamwork is your strongest weapon. Drive tanks, fly jets, command a squad, or play a range of infantry roles: Arma 3 gives you the freedom to fight your way in the most comprehensive military sandbox on PC, now enhanced with the Apex and Contact expansions. From battling it out on the arid islands of Altis and Stratis in the East Wind campaign, to infiltrating the fierce jungles of Tanoa in the cooperative campaign of the Apex Protocol, to navigating mankind's encounter with an alien presence in First Contact, Arma 3 offers countless hours of replayable singleplayer and cooperative campaigns, scenarios, showcase missions, challenges, virtual arsenal and garage, and more. Fight online in the massive military sandbox that is Arma 3. Form a squad and team up against your enemy in the official Combat Patrol, Escape and Warlords multiplayer scenarios, or jump into one of the many popular unofficial game modes developed by the Arma 3 community. Experience engaging multiplayer scenarios in Arma 3 Zeus, where Game Masters can curate and influence the battlefield of other players in real-time. To get the most out of your multiplayer milsim experience, you can even join one of the long-standing and dedicated multiplayer community units. Customize your loadout down to the last detail for any mission and engagement. With over 80 weapons, customizable loadouts with short- and long-distance attachments, and a plethora of clothing and equipment to choose from, Arma 3 opens up a world of tactical opportunities. Head into combat on foot, drive various types of light and heavy armor, operate autonomous vehicles, or take to the skies in helicopters and jets. Conduct combined arms operations over air, land, and sea, with over 40 intricately modeled and accurately simulated vehicles to drive and pilot. Master combined arms warfare across the sun-scorched Mediterranean islands of Altis, Stratis, and Malden, navigate the dense, hostile jungles of the South Pacific in Tanoa, and survive the militarized temperate woodlands of Livonia. Arma 3 features massive terrains totaling over 610 km² of open-world terrain. Explore over 160,000 user-generated items available for download on the Steam Workshop, ranging from custom weapons and vehicles to intense singleplayer scenarios and entirely new multiplayer game modes. Create your own intricate and immersive scenarios with Arma 3's comprehensive and intuitive Eden editor, and share your content with the community. Arma 3 can be enhanced with a vast library of DLC that adds new assets, capabilities, and transports you to entirely new theaters of war. Additional weapons, tanks, jets, helicopters, and more are available for purchase as official DLC and Creator DLC (CDLC) to expand and customize your Arma 3 experience. Expansive terrains transport you to the treacherous jungles of Vietnam, the fields and forests of Cold War Germany, and to the sun-scorched desert of the Sahara, and more, giving you thousands of additional hours of playtime. For those who want all available official content from the get-go, Arma 3 Platinum includes the base game and every official expansion and DLC.\",\"appHubTab\":\"workshop\",\"bStandaloneWorkshop\":false}","{\"app\":{\"appid\":107410},\"appHubHeader\":{\"appid\":107410,\"name\":\"Arma 3\",\"eVisibility\":0,\"bIsValidAppHub\":true,\"bAllowWebUploads\":true,\"rgHiddenTabs\":[],\"rgContentDescriptorIDs\":[2,5],\"rgUserPreferencesOverlappingContentDescriptorIDs\":[],\"bShowAdminTab\":false,\"bStoreVisible\":true,\"strHeaderImageURL\":\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/107410/header.jpg?t=1786458620\",\"strIntegratedGuideURL\":\"\",\"strRedirectURL\":\"\",\"bHideDefaultGuideCategories\":false},\"workshopConfig\":{\"appid\":107410,\"private\":false,\"workshop_header\":\"cb7a88afcee9c4a0fb5b5c44f77ba0d339bbd2e6\",\"workshop_title\":\"Discover the best community content\",\"workshop_desc\":\"Get the most out of Arma 3 with Steam Workshop. Find and install player-created scenarios and mods, or create your own and upload it directly to Steam.\",\"workshop_special_event_title\":\"\",\"workshop_special_event_desc\":\"\",\"instructionsURL\":\"http://arma3.com/workshop101\",\"visibletogroupid\":null,\"alwaysvisibletoappowners\":true,\"showplayeditemsfilter\":true,\"feature_playtime_tracking\":false,\"cansubscribefrombrowseview\":true,\"aspect_ratio\":\"square\",\"aspect_ratio_curated_items\":\"\",\"aspect_ratio_readytouse_items\":\"\",\"usesquarethumbnails\":false,\"new\":false,\"canwebsubmit\":false,\"moderated\":false,\"tags_as_tabs\":[],\"external_tag_selector_url\":\"\",\"accepted_for_game_text\":\"\",\"service_providers\":[],\"feature_ready_to_use_content\":true,\"feature_item_curation\":false,\"feature_item_mtx\":false,\"feature_item_merch\":false,\"workshop_split_access\":true,\"contributor_revenue_share\":0,\"feature_author id\":\"13180\",\"name\":\"Russian\",\"display_name\":\"Russian\",\"admin_only\":false},{\"id\":\"13181\",\"name\":\"Spanish\",\"display_name\":\"Spanish\",\"admin_only\":false},{\"id\":\"13182\",\"name\":\"Swedish\",\"display_name\":\"Swedish\",\"admin_only\":false},{\"id\":\"13183\",\"name\":\"Thai\",\"display_name\":\"Thai\",\"admin_only\":false},{\"id\":\"13185\",\"name\":\"Turkish\",\"display_name\":\"Turkish\",\"admin_only\":false},{\"id\":\"21532\",\"name\":\"Ukrainian\",\"display_name\":\"Ukrainian\",\"admin_only\":false},{\"id\":\"320994\",\"name\":\"latam\",\"display_name\":\"Spanish-Latin America\",\"admin_only\":false},{\"id\":\"320995\",\"name\":\"vietnamese\",\"display_name\":\"Vietnamese\",\"admin_only\":false}]}],\"video_tags\":[],\"screenshot_tags\":[],\"image_tags\":[],\"merch_tags\":[],\"visible_admin_tags\":[]},\"dataUpdateCount\":1,\"dataUpdatedAt\":1794845948749,\"error\":null,\"errorUpdateCount\":0,\"errorUpdatedAt\":0,\"fetchFailureCount\":0,\"fetchFailureReason\":null,\"fetchMeta\":null,\"isInvalidated\":false,\"status\":\"success\",\"fetchStatus\":\"idle\"},\"queryKey\":[\"declared_tags_v6\",766,\"english\",false],\"queryHash\":\"[\\\"declared_tags_v6\\\",766,\\\"english\\\",false]\"},{\"state\":{\"data\":\"[p align=\\\"start\\\"][i]Authentic, diverse, open: Arma 3 sends you to war. The third installment in the legendary Arma franchise is the gold standard military sandbox on PC, featuring combined arms warfare, authentic weapons and assets, and a wide variety of single- and multiplayer content. Arma 3 now includes the Apex and Contact expansions, offering hundreds of hours of additional gameplay right out of the box. And for those who want all available official content from the get-go, Arma 3 Platinum includes the base game and every official expansion and DLC.[/i][/p][p][/p][p align=\\\"center\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/b87880bf778dc559c4ee75c7cd4c6e07.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/b87880bf778dc559c4ee75c7cd4c6e07.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/2c8baa626341091b6270751f9cd1dc2f.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/2c8baa626341091b6270751f9cd1dc2f.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/2c8baa626341091b6270751f9cd1dc2f.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/2c8baa626341091b6270751f9cd1dc2f.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]Deploy into massive open worlds where ballistics are realistic, maneuvering keeps you alive, and teamwork is your strongest weapon. Drive tanks, fly jets, command a squad, or play a range of infantry roles: Arma 3 gives you the freedom to fight your way in the most comprehensive military sandbox on PC, now enhanced with the Apex and Contact expansions.[/p][p][/p][p align=\\\"start\\\"] [/p][p align=\\\"center\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/427a11f7740768e7b80707a5dea5e57b.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/427a11f7740768e7b80707a5dea5e57b.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/3e2c550df489f99dbc46d4bc2db7507e.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/3e2c550df489f99dbc46d4bc2db7507e.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/3e2c550df489f99dbc46d4bc2db7507e.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/3e2c550df489f99dbc46d4bc2db7507e.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]From battling it out on the arid islands of Altis and Stratis in the East Wind campaign, to infiltrating the fierce jungles of Tanoa in the cooperative campaign of the Apex Protocol, to navigating mankind's encounter with an alien presence in First Contact, Arma 3 offers countless hours of replayable singleplayer and cooperative campaigns, scenarios, showcase missions, challenges, virtual arsenal and garage, and more.[/p][p][/p][p align=\\\"center\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/d783f65d625feeddf06dbfb7be876a97.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/d783f65d625feeddf06dbfb7be876a97.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/1ff7bcff1ec05592e574390f6980fa7f.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/1ff7bcff1ec05592e574390f6980fa7f.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/1ff7bcff1ec05592e574390f6980fa7f.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/1ff7bcff1ec05592e574390f6980fa7f.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]Fight online in the massive military sandbox that is Arma 3. Form a squad and team up against your enemy in the official Combat Patrol, Escape and Warlords multiplayer scenarios, or jump into one of the many popular unofficial game modes developed by the Arma 3 community. Experience engaging multiplayer scenarios in Arma 3 Zeus, where Game Masters can curate and influence the battlefield of other players in real-time. To get the most out of your multiplayer milsim experience, you can even join one of the long-standing and dedicated multiplayer community units.[/p][p][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/5effda461b05ec8e7782a7f8e10ec9bb.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/5effda461b05ec8e7782a7f8e10ec9bb.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/da4aeef6a1c0f0e1726e7ebd2cbb2752.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/da4aeef6a1c0f0e1726e7ebd2cbb2752.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/da4aeef6a1c0f0e1726e7ebd2cbb2752.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/da4aeef6a1c0f0e1726e7ebd2cbb2752.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]Customize your loadout down to the last detail for any mission and engagement. With over 80 weapons, customizable loadouts with short- and long-distance attachments, and a plethora of clothing and equipment to choose from, Arma 3 opens up a world of tactical opportunities.[/p][p][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/5acc237a12a38081106e9f579141f26a.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/5acc237a12a38081106e9f579141f26a.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/48480fdef18a2b6aa2290656aa178c32.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/48480fdef18a2b6aa2290656aa178c32.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/48480fdef18a2b6aa2290656aa178c32.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/48480fdef18a2b6aa2290656aa178c32.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]Head into combat on foot, drive various types of light and heavy armor, operate autonomous vehicles, or take to the skies in helicopters and jets. Conduct combined arms operations over air, land, and sea, with over 40 intricately modeled and accurately simulated vehicles to drive and pilot.[/p][p][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/12e3344777cfab902e6a3d8acef12527.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/12e3344777cfab902e6a3d8acef12527.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/479bf9a9972d9380ac3e01e2b336f255.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/479bf9a9972d9380ac3e01e2b336f255.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/479bf9a9972d9380ac3e01e2b336f255.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/479bf9a9972d9380ac3e01e2b336f255.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]Master combined arms warfare across the sun-scorched Mediterranean islands of Altis, Stratis, and Malden, navigate the dense, hostile jungles of the South Pacific in Tanoa, and survive the militarized temperate woodlands of Livonia. Arma 3 features massive terrains totaling over 610 km² of open-world terrain. [/p][p][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/1310a59f2530810dac5c36a7642db0ed.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/1310a59f2530810dac5c36a7642db0ed.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/882ddf5a15368b745726dda92ad507a1.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/882ddf5a15368b745726dda92ad507a1.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/882ddf5a15368b745726dda92ad507a1.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/882ddf5a15368b745726dda92ad507a1.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]Explore over 160,000 user-generated items available for download on the Steam Workshop, ranging from custom weapons and vehicles to intense singleplayer scenarios and entirely new multiplayer game modes. Create your own intricate and immersive scenarios with Arma 3's comprehensive and intuitive Eden editor, and share your content with the community.[/p][p][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/18c702db59bc43a51e5e13b53c6486c5.avif\\\" width=\\\"780\\\" height=\\\"70\\\" avif=\\\"{STEAM_APP_IMAGE}/extras/18c702db59bc43a51e5e13b53c6486c5.avif\\\" fromclient=1][/img][/p][p align=\\\"start\\\"][img src=\\\"{STEAM_APP_IMAGE}/extras/801902da156afcddbd90e55269defe9e.poster.avif\\\" poster=\\\"{STEAM_APP_IMAGE}/extras/801902da156afcddbd90e55269defe9e.poster.avif\\\" width=\\\"780\\\" height=\\\"438\\\" mp4=\\\"{STEAM_APP_IMAGE}/extras/801902da156afcddbd90e55269defe9e.mp4\\\" webm=\\\"{STEAM_APP_IMAGE}/extras/801902da156afcddbd90e55269defe9e.webm\\\" fromclient=1][/img][/p][p align=\\\"start\\\"]Arma 3 can be enhanced with a vast library of DLC that adds new assets, capabilities, and transports you to entirely new theaters of war. Additional weapons, tanks, jets, helicopters, and more are available for purchase as official DLC and Creator DLC (CDLC) to expand and customize your Arma 3 experience. Expansive terrains transport you to the treacherous jungles of Vietnam, the fields and forests of Cold War Germany, and to the sun-scorched desert of the Sahara, and more, giving you thousands of additional hours of playtime. For those who want all available official content from the get-go, Arma 3 Platinum includes the base game and every official expansion and DLC.[/p][p] \\r\\n[/p]\",\"dataUpdateCount\":1,\"dataUpdatedAt\":1794845948756,\"error\":null,\"errorUpdateCount\":0,\"errorUpdatedAt\":0,\"fetchFailureCount\":0,\"fetchFailureReason\":null,\"fetchMeta\":null,\"isInvalidated\":false,\"status\":\"success\",\"fetchStatus\":\"idle\"},\"queryKey\":[\"StoreItem\",\"app_107410\",\"include_full_description\"],\"queryHash\":\"[\\\"StoreItem\\\",\\\"app_107410\\\",\\\"include_full_description\\\"]\"},{\"state\":{\"data\":{\"friends\":{\"_t\":9,\"v\":[]},\"ignored\":{\"_t\":9,\"v\":[]}},\"dataUpdateCount\":1,\"dataUpdatedAt\":1794845948756,\"error\":null,\"errorUpdateCount\":0,\"errorUpdatedAt\":0,\"fetchFailureCount\":0,\"fetchFailureReason\":null,\"fetchMeta\":null,\"isInvalidated\":false,\"status\":\"success\",\"fetchStatus\":\"idle\"},\"queryKey\":[\"workshop_user_friends_list\",\"0\"],\"queryHash\":\"[\\\"workshop_user_friends_list\\\",\\\"0\\\"]\"},{\"state\":{\"data\":{\"total\":174810,\"total_accepted\":0,\"total_incompatible\":83},\"dataUpdateCount\":1,\"dataUpdatedAt\":1794845948756,\"error\":null,\"errorUpdateCount\":0,\"errorUpdatedAt\":0,\"fetchFailureCount\":0,\"fetchFailureReason\":null,\"fetchMeta\":null,\"isInvalidated\":false,\"status\":\"success\",\"fetchStatus\":\"idle\"},\"queryKey\":[\"workshop_about_numbers\",\"v4\",107410,1],\"queryHash\":\"[\\\"workshop_about_numbers\\\",\\\"v4\\\",107410,1]\"},{\"state\":{\"data\":[{\"appid\":395180,\"count\":3445},{\"appid\":1325500,\"count\":287},{\"appid\":1021790,\
